name: HelixHead
options:
  bundleIdPrefix: com.zongruichd
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: NO
targets:
  HelixHead:
    type: application
    platform: iOS
    sources: [HelixHead]
    info:
      path: HelixHead/Info.plist
      properties:
        CFBundleDisplayName: Helix Head
        NSMotionUsageDescription: 读取 AirPods 的头部运动，让屏幕中的头部实时跟随你。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  HelixHeadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HelixHead
  HelixHeadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HelixHead
schemes:
  HelixHead:
    build:
      targets:
        HelixHead: all
    test:
      targets: [HelixHeadTests, HelixHeadUITests]
