name: Build and release unsigned IPA
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional new release tag, e.g. v1.0.0 (created only after tests pass)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | tee toolchain.txt
          sw_vers >> toolchain.txt
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          zip -qr build/HelixHead-XcodeProject.zip HelixHead.xcodeproj HelixHead Tests UITests project.yml README.md
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project HelixHead.xcodeproj -scheme HelixHead -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log | xcbeautify
      - name: Test on iPhone simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project HelixHead.xcodeproj -scheme HelixHead -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee build-tests.log | xcbeautify
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/HelixHead.app build/package/Payload/
          if codesign -dv build/package/Payload/HelixHead.app 2>/dev/null; then
            echo 'Expected an unsigned device app'; exit 1
          fi
          cd build/package
          /usr/bin/zip -qry ../HelixHead-unsigned.ipa Payload
          cd ..
          shasum -a 256 HelixHead-unsigned.ipa > SHA256SUMS.txt
          unzip -t HelixHead-unsigned.ipa
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HelixHead-build-evidence
          path: |
            build/*.ipa
            build/HelixHead-XcodeProject.zip
            build/SHA256SUMS.txt
            build/Tests.xcresult
            build/screenshots
            build-*.log
            toolchain.txt
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$REQUESTED_TAG"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo 'Manual release requires a new tag'; exit 1
            fi
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
          gh release create "$RELEASE_TAG" build/HelixHead-unsigned.ipa build/SHA256SUMS.txt build/HelixHead-XcodeProject.zip toolchain.txt --target "$GITHUB_SHA" --title "Helix Head $RELEASE_TAG" --notes-file RELEASE_NOTES.md
